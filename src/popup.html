<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 260px; margin: 12px; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  input[type=range] { width: 130px; }
</style>
<label>Use Calm Captions <input id="enabled" type="checkbox"></label>
<label>Text size <input id="size" type="range" min="50" max="400" step="5"></label>
<label>Background opacity <input id="opacity" type="range" min="0" max="100"></label>
<label>Background color <input id="bg" type="color"></label>
<label>Text color <input id="color" type="color"></label>
<script src="popup.js"></script>
