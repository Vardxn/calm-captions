<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 260px; margin: 12px; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  input[type=range] { width: 130px; }
</style>
<label>Use Calm Captions <input id="enabled" type="checkbox"></label>
<label>Group words (auto captions) <input id="group" type="checkbox"></label>
<label>Words per group <input id="words" type="number" min="3" max="12"></label>
<label>Text size <input id="size" type="range" min="0.5" max="4" step="0.1"></label>
<label>Background opacity <input id="opacity" type="range" min="0" max="100"></label>
<label>Corner roundness <input id="radius" type="range" min="0" max="80"></label>
<label>Height from bottom <input id="bottom" type="range" min="3" max="40"></label>
<label>Background color <input id="bg" type="color"></label>
<label>Text color <input id="color" type="color"></label>
<label>Font
  <select id="font"><option value="outfit">Outfit (rounded)</option><option value="system">System</option></select>
</label>
<script src="popup.js"></script>
